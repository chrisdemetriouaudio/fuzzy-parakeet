# Deploys chrisdemetriou.com (the site Worker) when a change to the website reaches main:
# tests first, then `wrangler deploy`, then the URL-parity check against the live address
# (preview.chrisdemetriou.com until the cutover, then chrisdemetriou.com). Decision D24.
# Needs two repository secrets, set by Chris: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they exist, the job just says so and stops, green.
name: Deploy site
on:
  push:
    branches: [main]
    # Everything .assetsignore publishes, plus the Worker. worker/test checks this list
    # covers every published path, so a new public folder can't be missed.
    paths:
      - "index.html"
      - "404.html"
      - "creative/**"
      - "privacy/**"
      - "cookies/**"
      - "work/**"
      - "resources/**"
      - "styles/**"
      - "scripts/**"
      - "fonts/**"
      - "images/**"
      - "robots.txt"
      - "sitemap.xml"
      - "llms.txt"
      - "favicon.ico"
      - "favicon-32.png"
      - "apple-touch-icon.png"
      - "icon-192.png"
      - "icon-512.png"
      - "og-image.jpg"
      - "worker/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-site
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'chrisdemetriouaudio/fuzzy-parakeet'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Stop here until the Cloudflare secrets are set
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so nothing was deployed."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
      - name: Install wrangler
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
      - name: Test
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm test
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Check every URL on the live address
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run parity
