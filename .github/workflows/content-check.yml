# Checks the evidence-gated publishing system: tests, gates, and that built pages and
# sitemap.xml match the approved records. Fails if an approval was committed by an AI.
name: Content checks
on:
  pull_request:
    paths: ["content/**", "publisher/**", "sitemap.xml", "work/**", "resources/**", "index.html", "creative/**", "privacy/**", "cookies/**", ".github/workflows/content-check.yml"]
  push:
    branches: [main]
    paths: ["content/**", "publisher/**", "sitemap.xml", "work/**", "resources/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test publisher/test/*.test.mjs
      - run: node publisher/cli.mjs check
