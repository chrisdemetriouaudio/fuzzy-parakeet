# Conversation evals (Phase 9, step 9): ten scripted visitors against the live chat model,
# graded on the spec's eight rules. Run by hand (Actions → Conversation evals → Run
# workflow) or by Claude after a prompt change. About 60 model calls from the free tier.
# The pass/fail table appears on the run's summary page; the full chats are an artifact.
name: Conversation evals
on:
  workflow_dispatch:
    inputs:
      persona:
        description: Only personas whose name contains this (blank = all ten)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  evals:
    if: github.repository == 'chrisdemetriouaudio/fuzzy-parakeet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: Run the personas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node evals/run.mjs "${{ inputs.persona }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results.md
          if-no-files-found: ignore
