# GitHub Pages publishes this repo as chrisdemetriou.com. These folders and files
# are tooling and notes, not website pages, so they are never published:
#   labs/                 labs.chrisdemetriou.com (a Cloudflare Worker, released separately)
#   chrisdemetriou-PMO/   the Obsidian project notes (PMO)
#   content/              evidence records, drafts and approvals (never public pages)
#   publisher/            the publishing generator and its tests
#   docs/                 search, publishing and lead chat documentation
#   worker/, wrangler.jsonc  the Cloudflare Worker that will serve this site (Phase 9)
exclude:
  - labs/
  - chrisdemetriou-PMO/
  - content/
  - publisher/
  - docs/
  - worker/
  - wrangler.jsonc
  - migrations/
  - vitest.config.mjs
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - node_modules/
  - package.json
  - package-lock.json
