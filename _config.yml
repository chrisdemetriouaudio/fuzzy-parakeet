#   chrisdemetriou-PMO/   the Obsidian project notes (PMO)
#   agents/               the CEO agent and its departments (runs locally, released separately)
exclude:
  - labs/
  - chrisdemetriou-PMO/
  - agents/
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - node_modules/
  - package.json
  - package-lock.json
