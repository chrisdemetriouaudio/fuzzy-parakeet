<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Chris Demetriou</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<script>
  // GitHub Pages can't redirect on the server, but it serves this page (with a real 404
  // status) for any missing address. Pages retired on purpose go to their nearest
  // replacement; anything else stays here and says so, rather than silently landing on
  // the homepage.
  (function(){
    var moved = {
      '/media/': '/creative/#media',      // the old media site (Aug 2026)
      '/book/': '/#contact',              // the old "book a call" page
      '/enterprise/': '/',                // the old enterprise IT pages
    };
    var path = location.pathname.replace(/\/index\.html$/, '/');
    if (!/\/$/.test(path)) path += '/';
    for (var from in moved) {
      if (path.indexOf(from) === 0) { location.replace(moved[from]); return; }
    }
  })();
</script>
<style>
  :root{ color-scheme:light; --bg:#FFF7EC; --ink:#23201C; --ink-muted:#5E564C; --accent:#B53A1E; --border:#E3D6C3; }
  html, body{ margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--ink); }
  body{
    font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 17px; line-height: 1.6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; box-sizing: border-box;
  }
  main{ max-width: 520px; }
  .label{ font-weight: 700; font-size: 15px; color: var(--accent); margin: 0 0 12px; }
  h1{ font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
  p{ color: var(--ink-muted); margin: 0 0 22px; }
  ul{ list-style: none; margin: 0; padding: 0; border-top: 2px dashed var(--border); }
  li{ border-bottom: 2px dashed var(--border); }
  a{ display: block; padding: 12px 0; color: var(--ink); font-weight: 700; text-decoration: none; }
  a:hover{ color: var(--accent); }
  a:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>
  <main>
    <p class="label">404 · Not found</p>
    <h1>That page isn&rsquo;t here.</h1>
    <p>It may have moved, or the link may be mistyped. These are the main parts of the site:</p>
    <ul>
      <li><a href="/">Custom software &rarr;</a></li>
      <li><a href="/creative/">Music, media and worship &rarr;</a></li>
      <li><a href="https://labs.chrisdemetriou.com/">Labs: every project &rarr;</a></li>
      <li><a href="/#contact">Contact &rarr;</a></li>
    </ul>
  </main>
</body>
</html>
