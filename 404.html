<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Chris Demetriou</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">

<style>
  .notfound { min-height: 100svh; display: flex; align-items: center; }
  .notfound__inner { max-width: 44rem; padding-block: clamp(3rem, 8vh, 5rem); }
  .notfound h1 {
      font-size: clamp(30px, 4.4vw, 48px);
      margin-block: 18px 22px;
      max-width: 20ch;
  }
  .notfound__actions { display: flex; flex-wrap: wrap; gap: 14px; margin-block-start: 36px; }
</style>
</head>

<body>
<div class="notfound">
  <div class="wrap notfound__inner">
    <p class="eyebrow">404</p>
    <h1>That page has moved, or never existed.</h1>
    <p>
      The site is now one page for enterprise technology, and a separate section for
      creative media. If you followed an older link, one of these is what you were after.
    </p>
    <div class="notfound__actions">
      <a class="btn btn--solid btn--lg" href="/">Enterprise Technology &nbsp;&rarr;</a>
      <a class="btn btn--line" href="/media/">Creative Media</a>
    </div>
  </div>
</div>

<script>
/* Two generations of URLs to forward. The media site occupied the apex before
   the restructure, so its anchors are sent to /media/. The enterprise case
   briefly lived at /enterprise/ before becoming the root, so those go home. */
(function () {
  var path = window.location.pathname.replace(/\/+$/, '');

  if (path === '/enterprise' || path.indexOf('/enterprise/') === 0) {
    window.location.replace('/');
    return;
  }

  var legacy = ['/index.html', '/style3.css', '/script.js'];
  if (legacy.indexOf(path) !== -1) {
    window.location.replace('/media' + path + window.location.hash);
    return;
  }

  var MEDIA_ANCHORS = [
    'soundcloud-section', 'what-i-do', 'skills-strip', 'case-study', 'career',
    'credits', 'feedback-section', 'about', 'about-heading', 'contact'
  ];
  var hash = window.location.hash.replace('#', '');
  if (hash && MEDIA_ANCHORS.indexOf(hash) !== -1) {
    window.location.replace('/media/#' + hash);
  }
})();
</script>
</body>
</html>
