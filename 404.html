<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting — Chris Demetriou</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://chrisdemetriou.com/">
<meta http-equiv="refresh" content="0; url=/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<script>if (location.pathname !== '/') location.replace('/');</script>
<style>
  :root{
    --bg: #121014;
    --ink: #ede6dd;
    --ink-muted: #928c96;
    --amber: #e8a34d;
  }
  html, body{ margin:0; padding:0; height:100%; background: var(--bg); color: var(--ink); }
  body{
    font-family: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  p{ color: var(--ink-muted); line-height: 1.6; margin: 0 0 22px; }
  a{
    font-family: ui-monospace, 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid var(--amber);
    padding-bottom: 5px;
  }
  a:focus-visible{ outline: 2px solid var(--amber); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
  <div>
    <p>That page has moved. Taking you to the homepage&hellip;</p>
    <a href="/">Go to chrisdemetriou.com &rarr;</a>
  </div>
</body>
</html>
